# Supervision 浼佷笟鏅鸿兘鐫ｅ姙骞冲彴 鈥斺€?鐢熶骇缂栨帓
# 瀵瑰绔彛锛?002锛圢ginx 鍙嶄唬鍓嶇 + /api 鍚庣锛?
# 鏁版嵁搴?/ Redis / RabbitMQ 浠呭鍣ㄩ棿浜掗€氾紝涓嶆毚闇插埌瀹夸富鏈哄叕缃戙€?
#
# 鍚姩锛?docker compose up -d --build
# 鍋滄锛?docker compose down
# 鏃ュ織锛?docker compose logs -f api

services:
  mysql:
    image: mysql:8.0.36
    container_name: supervision-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --innodb-buffer-pool-size=64M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: supervision
      MYSQL_USER: ${DB_USERNAME:-supervision}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./build/backend/src/main/resources/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: supervision-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: supervision-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-supervision}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    volumes:
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 15

  api:
    build:
      context: ./build/backend
      dockerfile: Dockerfile
    image: supervision-api:${SUPERVISION_RELEASE:-latest}
    container_name: supervision-api
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: supervision
      DB_USERNAME: ${DB_USERNAME:-supervision}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      SUPERVISION_CRYPTO_KEY: ${SUPERVISION_CRYPTO_KEY:?Set SUPERVISION_CRYPTO_KEY in .env}
      SUPERVISION_ADMIN_USERNAME: ${SUPERVISION_ADMIN_USERNAME:-admin}
      SUPERVISION_ADMIN_PASSWORD: ${SUPERVISION_ADMIN_PASSWORD:-}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-supervision}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      # Spring Boot 瑙勮寖鐜鍙橀噺锛堢‘淇濈粦瀹氬埌 spring.rabbitmq.*锛?
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-supervision}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      TZ: Asia/Shanghai
      # 閽堝 2G 鍐呭瓨鏈嶅姟鍣ㄦ敹绱у爢鍐呭瓨
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseG1GC -Duser.timezone=Asia/Shanghai"
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    image: supervision-web:${SUPERVISION_RELEASE:-latest}
    container_name: supervision-web
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8002:80"

volumes:
  mysql-data:
